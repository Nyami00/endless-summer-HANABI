        this.reverb.buffer=impulse;this.wet=c.createGain();this.wet.gain.value=.24;this.reverb.connect(this.wet);this.wet.connect(this.master);
        this.buffers=prepareBuffers(c);
      }
      await this.ctx.resume();
    }
    // 音源位置に応じたパン付きの出力先。dry は master と reverb（送り量 reverbSend）へ、sub は master 直結。
    bus(e,reverbSend=1){
      const c=this.ctx,dry=c.createStereoPanner?c.createStereoPanner():c.createGain(),send=c.createGain();
      if(dry.pan){const p=project(e.x,e.y,e.z);dry.pan.value=clamp(p?(p.x/W-.5)*1.6:0,-.9,.9);}
      send.gain.value=reverbSend;dry.connect(this.master);dry.connect(send);send.connect(this.reverb);
      return {dry,sub:this.master,release(){try{dry.disconnect();send.disconnect();}catch{}}};
    }
    play(e){
      const c=this.ctx;if(!c||c.state!=='running')return;const now=c.currentTime,t=now+.005;
      if(e.kind==='whistle'){
        const verdict=whistleArbiter(this.whistles,{power:e.power,priority:!!e.priority});
        if(verdict.action==='skip')return;
        if(verdict.action==='replace'){const [old]=this.whistles.splice(verdict.index,1);old.stop(.15);}
        const p=whistleProfile(e.power,e.duration,e.d),bus=this.bus(e,p.reverbSend),voice=buildWhistle(c,bus,t,p,this.buffers);
        voice.power=e.power;voice.onended=()=>{const i=this.whistles.indexOf(voice);if(i>=0)this.whistles.splice(i,1);bus.release();};
        this.whistles.push(voice);return;
      }
      if(this.active>18||now-this.last<.035)return;this.last=now;this.active++;
      const p=profileFor(e.kind,e.power,e.d),bus=this.bus(e,p.reverbSend);
      const voice=buildBurst(c,bus,t,p,this.buffers);

    }
    // 自己診断用: 同じ builder で OfflineAudioContext に描画し、モノラルの波形を返す
    async renderOffline(kind,power,duration=5.1,distance=1000){
      const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC)throw new Error('OfflineAudioContext unavailable');
      const sr=44100,c=new OAC(1,Math.ceil(sr*(duration+1)),sr),buffers=prepareBuffers(c),master=c.createGain();master.connect(c.destination);
      const bus={dry:master,sub:master,release(){}};
      if(kind==='whistle')buildWhistle(c,bus,.05,whistleProfile(power,duration,distance),buffers);
      else buildBurst(c,bus,.05,profileFor(kind,power,distance),buffers);
      return (await c.startRendering()).getChannelData(0);
    }
    async mute(value){if(!this.ctx)return;if(value)await this.ctx.suspend();else if(soundOn)await this.ctx.resume();}
  }
  const audio=new Soundscape();
  // ---- 自己診断 (?selftest=1)。音は OfflineAudioContext に描画して「長さ・音程の向き・減衰の傾向」を検査する ----
  const SELFTEST_SR=44100;
  function zeroCrossingRate(data,from,to,sr=SELFTEST_SR){
    const a=Math.max(1,Math.floor(from*sr)),b=Math.min(data.length-1,Math.floor(to*sr));let n=0;
    for(let i=a;i<=b;i++)if((data[i-1]<0)!==(data[i]<0))n++;
    return n/Math.max(1e-6,(b-a)/sr);
  }
  function audibleSeconds(data,threshold=.002,sr=SELFTEST_SR){
    let first=-1,last=-1;for(let i=0;i<data.length;i++)if(Math.abs(data[i])>threshold){if(first<0)first=i;last=i;}
    return first<0?0:(last-first)/sr;
  }
  // 20ms 窓の RMS を取り、ピークからピークの 10% を下回るまでの秒数
  function decayProfile(data,sr=SELFTEST_SR){
    const win=Math.floor(sr*.02),r=[];let peak=0,peakIndex=0;
    for(let i=0;i+win<=data.length;i+=win){let s=0;for(let j=i;j<i+win;j++)s+=data[j]*data[j];const v=Math.sqrt(s/win);r.push(v);if(v>peak){peak=v;peakIndex=r.length-1;}}
    for(let k=peakIndex;k<r.length;k++)if(r[k]<peak*.1)return {peak,time:(k-peakIndex)*win/sr};
    return {peak,time:(r.length-peakIndex)*win/sr};
  }
  async function runSelfTest(){
    const results=[],check=(name,pass,detail='')=>results.push({name,pass:!!pass,detail});
    try{
      const big=await audio.renderOffline('whistle',1.2,5.1),small=await audio.renderOffline('whistle',.6,5.1),pBig=whistleProfile(1.2,5.1,1000);
      const length=audibleSeconds(big);
      check('whistle length matches profile',Math.abs(length-pBig.dur)<.2,`${length.toFixed(2)}s vs ${pBig.dur.toFixed(2)}s`);
      const early=zeroCrossingRate(big,.35,.85),late=zeroCrossingRate(big,.05+pBig.dur-.8,.05+pBig.dur-.3);
      check('whistle pitch rises',late>early,`${early.toFixed(0)} -> ${late.toFixed(0)} crossings/s`);
      const smallEarly=zeroCrossingRate(small,.35,.85);
      check('small shell whistles higher',smallEarly>early,`${smallEarly.toFixed(0)} vs ${early.toFixed(0)}`);
      const boomBig=decayProfile(await audio.renderOffline('burst',1.2)),boomSmall=decayProfile(await audio.renderOffline('burst',.6));
      check('big boom decays longer',boomBig.time>boomSmall.time,`${boomBig.time.toFixed(2)}s vs ${boomSmall.time.toFixed(2)}s`);
      check('big boom is louder',boomBig.peak>boomSmall.peak,`${boomBig.peak.toFixed(3)} vs ${boomSmall.peak.toFixed(3)}`);
    }catch(err){check('offline audio render',false,String(err));}
    for(const ch of ['祝','A','あ']){
      const pts=sampleGlyph(ch),n=pts.length/2;let inRange=true;
      for(let i=0;i<pts.length;i++)if(Math.abs(pts[i])>1.0001)inRange=false;
      check(`glyph ${ch} sampled`,n>=40&&n<=320&&inRange,`${n} points`);
    }
    const passed=results.filter(r=>r.pass).length;
    console.table(results);toast(`自己診断 ${passed}/${results.length} 合格`);
    return results;
  }
  const icons={pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12m6-12v12" stroke-width="2.5"/></svg>',play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></svg>',off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4V4Zm5 5 5 6m0-6-5 6"/></svg>',on:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4V4Zm4 4c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></svg>'};
  function updatePause(){const label=paused?'再生':'一時停止';$('pause').innerHTML=paused?icons.play:icons.pause;$('pause').setAttribute('aria-label',label);$('pause').title=label;}
  function setPaused(value){paused=value;updatePause();audio.mute(paused).catch(()=>{});if(paused){cancelAnimationFrame(raf);raf=0;lastStamp=0;}else resumeLoop();}
  function resetView(){camera.targetYaw=0;camera.targetPitch=0;camera.targetZoom=1;if(paused){updateCamera(10);render();}}
  function setQuiet(value){quiet=value;document.body.classList.toggle('quiet',value);document.querySelector('.top').inert=value;document.querySelector('.bottom').inert=value;if(value)$('restore').focus({preventScroll:true});else $('hide').focus({preventScroll:true});}
  function render(){makeDrawData();renderer.render();}
  function step(dt){simTime+=dt;director(dt);pumpUrlText();pumpTextQueue();updatePhysics(dt);}
  function frame(stamp){raf=0;if(paused||document.hidden)return;const dt=lastStamp?clamp((stamp-lastStamp)/1000,0,.1):1/60;lastStamp=stamp;accumulator+=dt;
    while(accumulator>=1/60){step(1/60);accumulator-=1/60;}updateCamera(dt);render();raf=requestAnimationFrame(frame);
  }
  function resumeLoop(){lastStamp=0;accumulator=0;if(!raf&&!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
  function tap(x,y){
    if(paused)setPaused(false);const nx=(x/W*2-1)*(W/H)/camera.lens,ny=(1-y/H*2)/camera.lens;
    const ray=camera.forward.map((v,i)=>v+camera.right[i]*nx+camera.up[i]*ny);const t=Math.abs(ray[2])>.05?-camera.eye[2]/ray[2]:camera.distance;
    const tx=clamp(camera.eye[0]+ray[0]*t,-340*spread(),340*spread()),ty=clamp(camera.eye[1]+ray[1]*t,220,490);
    launch(pick(['yae','kiku','peony','willow','senrin','strobe','palm','ring']),tx,ty,rand(-40,70),rand(.8,1),pick(PALETTES),{priority:true});
  }
  // ---- 文字花火の隠し UI。T キー / ロゴ長押し / ?text= で開く。表パネルには出さない ----
  function setupLauncher(){
    const form=$('launcher'),input=$('text-input'),brand=document.querySelector('.brand');
    let composing=false,pressTimer=0,pressStart=null;
    const open=()=>{form.hidden=false;input.focus({preventScroll:true});input.select();};
    const close=()=>{if(form.hidden)return;form.hidden=true;surface.focus({preventScroll:true});};
    input.addEventListener('compositionstart',()=>{composing=true;});
    input.addEventListener('compositionend',()=>{composing=false;});
    input.addEventListener('keydown',e=>{
      // 日本語変換の確定 Enter では打ち上げない
      if(e.key==='Enter'&&(e.isComposing||e.keyCode===229||composing)){e.preventDefault();return;}
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();}
    });
    form.addEventListener('submit',e=>{e.preventDefault();if(composing)return;if(paused)setPaused(false);if(launchText(input.value))close();});
    $('launcher-close').addEventListener('click',close);
    const isTyping=el=>!!el&&(el.isContentEditable||el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['range','checkbox','radio','button'].includes(el.type)));
    document.addEventListener('keydown',e=>{
      if((e.key==='t'||e.key==='T')&&!isTyping(e.target)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();open();}
    });
    surface.addEventListener('pointerdown',close);
    brand.addEventListener('contextmenu',e=>e.preventDefault());
    const cancelPress=()=>{clearTimeout(pressTimer);pressStart=null;};
    brand.addEventListener('pointerdown',e=>{pressStart={x:e.clientX,y:e.clientY};clearTimeout(pressTimer);pressTimer=setTimeout(()=>{pressStart=null;open();},600);});
    brand.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>10)cancelPress();});
    for(const type of ['pointerup','pointercancel','pointerleave'])brand.addEventListener(type,cancelPress);
    return {open,close,isOpen:()=>!form.hidden};
  }
  function setupInput(){
    const pointers=new Map();let gesture=null,lastManual=-10;
    surface.addEventListener('pointerdown',e=>{
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});surface.setPointerCapture(e.pointerId);
      if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,yaw:camera.targetYaw,pitch:camera.targetPitch,moved:false,pinch:false};
      else if(pointers.size===2){const p=[...pointers.values()];gesture={...(gesture||{}),pinch:true,span:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:camera.targetZoom,moved:true};}
    });
    surface.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===2){const p=[...pointers.values()],span=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.targetZoom=clamp(gesture.zoom*gesture.span/Math.max(span,10),.65,1.5);}
      else if(!gesture.pinch){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>7)gesture.moved=true;camera.targetYaw=clamp(gesture.yaw-dx/W*.95,-.58,.58);camera.targetPitch=clamp(gesture.pitch+dy/H*.35,-.12,.18);}
      if(paused){updateCamera(10);render();}
    });
    function end(e,cancelled=false){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(gesture&&!gesture.moved&&!cancelled&&pointers.size===0&&simTime-lastManual>.3){tap(e.clientX,e.clientY);lastManual=simTime;}$('hint').style.opacity='.45';if(pointers.size===0)gesture=null;}
    surface.addEventListener('pointerup',e=>end(e));surface.addEventListener('pointercancel',e=>end(e,true));
    surface.addEventListener('wheel',e=>{e.preventDefault();camera.targetZoom=clamp(camera.targetZoom*Math.exp(e.deltaY*.001),.65,1.5);if(paused){updateCamera(10);render();}},{passive:false});
    surface.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();tap(W*.5,H*.4);}else if(e.code==='Space'){e.preventDefault();setPaused(!paused);}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key)){
        e.preventDefault();if(e.key==='Home')resetView();else if(e.key==='ArrowLeft')camera.targetYaw=clamp(camera.targetYaw-.06,-.58,.58);else if(e.key==='ArrowRight')camera.targetYaw=clamp(camera.targetYaw+.06,-.58,.58);else if(e.key==='ArrowUp')camera.targetPitch=clamp(camera.targetPitch+.025,-.12,.18);else camera.targetPitch=clamp(camera.targetPitch-.025,-.12,.18);if(paused){updateCamera(10);render();}
      }
    });
    surface.addEventListener('dblclick',e=>{e.preventDefault();resetView();});
    $('pause').addEventListener('click',()=>setPaused(!paused));$('finale').addEventListener('click',startFinale);
    $('density').addEventListener('input',e=>{density=Number(e.target.value);const label=['静けさ','余韻','標準','華やか','壮大'][density-1];$('density-text').value=label;e.target.setAttribute('aria-valuetext',label);e.target.style.setProperty('--fill',`${(density-1)*25}%`);});
    $('reset-view').addEventListener('click',resetView);$('hide').addEventListener('click',()=>setQuiet(true));$('restore').addEventListener('click',()=>setQuiet(false));
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&quiet)setQuiet(false);});
    $('sound').innerHTML=icons.off;
    $('sound').addEventListener('click',async()=>{
      $('sound').disabled=true;
      try{if(!soundOn)await audio.init();soundOn=!soundOn;await audio.mute(!soundOn||paused);$('sound').innerHTML=soundOn?icons.on:icons.off;$('sound').setAttribute('aria-pressed',String(soundOn));const label=soundOn?'音をオフにする':'音をオンにする';$('sound').setAttribute('aria-label',label);$('sound').title=label;if(soundOn)toast('光のあとに、距離に応じて音が届きます。');}catch{toast('この画面では音を利用できません。');}finally{$('sound').disabled=false;}
    });
    if(!document.documentElement.requestFullscreen)$('fullscreen').hidden=true;
    $('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('この画面では全画面表示を利用できません。');}});
    document.addEventListener('fullscreenchange',()=>{const s=document.fullscreenElement?'全画面表示を終了':'全画面表示';$('fullscreen').setAttribute('aria-label',s);$('fullscreen').title=s;});
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;audio.mute(true).catch(()=>{});}else{audio.mute(paused).catch(()=>{});resumeLoop();}});
    let resizeFrame=0;window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{W=innerWidth;H=innerHeight;updateCamera(10);renderer.resize();render();});});
    surface.addEventListener('webglcontextlost',e=>{e.preventDefault();setPaused(true);toast('描画が一時停止しました。復帰を待っています。');});
    surface.addEventListener('webglcontextrestored',()=>{try{renderer=new GLRenderer(surface);render();toast('描画が復帰しました。▶ で再生できます。');}catch{toast('描画を復帰できませんでした。ページを開き直してください。');}});
  }
  try{renderer=new GLRenderer(surface);}catch{
    const replacement=surface.cloneNode(true);surface.replaceWith(replacement);surface=replacement;
    try{renderer=new CanvasRenderer(surface);}catch{$('notice').textContent='このブラウザーでは花火を表示できません。';$('notice').classList.add('show');return;}
  }
  updateCamera(10);setupInput();setupLauncher();updatePause();
  // Begin part-way through the opening ascent, keeping its physical trajectory.
  for(let i=0;i<165;i++)step(1/60);
  if(urlText)urlTextAt=simTime+2.5;
  render();if(paused)toast('動きを抑える設定に合わせて停止中です。▶ で再生できます。');resumeLoop();
  if(params.has('debug'))window.HANABI=Object.freeze({launchText,sampleGlyph,sanitizeText,textLayout,burstProfile,whistleProfile,whistleArbiter,audio,
    // 検証用: rAF が止まる環境でも決定的にシミュレーションを進めて描画する（seconds 秒ぶん 1/60 刻み）
    advance:(seconds=1)=>{const n=Math.round(seconds*60);for(let i=0;i<n;i++)step(1/60);updateCamera(10);render();return simTime;},
    state:()=>({stars:stars.length,shells:shells.length,soundEvents:soundEvents.length,whistles:audio.whistles.length,textQueue:textQueue.length})});
  if(params.has('selftest'))window.HANABI_SELFTEST=runSelfTest();

})();

  </script>
